<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Cogistics Interactive Map</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%8D</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f5f7}
  form{background:#fff;padding:32px 28px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);width:100%;max-width:320px}
  h1{font-size:16px;margin-bottom:6px;color:#111}
  p{font-size:12px;color:#666;margin-bottom:18px}
  input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px}
  button{width:100%;padding:10px 12px;border:0;border-radius:8px;background:#185FA5;color:#fff;font-size:14px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  #err{color:#b00020;font-size:12px;margin-bottom:10px;display:none}
</style>
</head>
<body>
<form id="login-form">
  <h1>📍 Cogistics Interactive Map</h1>
  <p>Enter the password to view the map.</p>
  <div id="err"></div>
  <input type="password" id="password" placeholder="Password" autofocus required>
  <button type="submit" id="submit-btn">Sign in</button>
</form>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Checking…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      window.location.href = '/';
    } else {
      err.textContent = data.error || 'Incorrect password';
      err.style.display = 'block';
    }
  } catch {
    err.textContent = 'Something went wrong. Try again.';
    err.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
