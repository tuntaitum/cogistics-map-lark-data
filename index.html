<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cogistics Cold Storage Interactive Map</title>
<meta name="description" content="Interactive map of Cogistics cold storage locations and convenience store distribution centers of interest in Thailand.">
<meta property="og:title" content="Cogistics Cold Storage Interactive Map">
<meta property="og:description" content="Interactive map of Cogistics cold storage locations and convenience store distribution centers of interest in Thailand.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cogistics-interactive-map.vercel.app/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Cogistics Cold Storage Interactive Map">
<meta name="twitter:description" content="Interactive map of Cogistics cold storage locations and convenience store distribution centers of interest in Thailand.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%8D</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,sans-serif);background:transparent}
#map-wrap{position:relative;width:100%;background:var(--color-background-secondary,#f7f7f8);border-radius:var(--border-radius-lg,10px);overflow:hidden;border:0.5px solid var(--color-border-tertiary,#e2e2e2)}
#map{width:100%;height:calc(100vh - 90px)}
#controls{padding:12px 14px;border-top:0.5px solid var(--color-border-tertiary,#e2e2e2);background:var(--color-background-primary,#fff)}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.layer-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--border-radius-md,6px);border:0.5px solid var(--color-border-secondary,#ddd);background:var(--color-background-primary,#fff);cursor:pointer;font-size:12px;color:var(--color-text-secondary,#444);transition:all .15s}
.layer-btn.active{border-color:transparent;color:#fff}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 14px;border-top:0.5px solid var(--color-border-tertiary,#e2e2e2)}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary,#555)}
.leaflet-popup-close-button{display:none !important}
.small-label{background:rgba(255,255,255,0.85);border:none;box-shadow:none;padding:1px 4px;font-size:9px;line-height:1.2;color:#333;font-weight:500;white-space:nowrap}
.small-label::before{display:none}
.overlay-row{padding-top:8px;margin-top:8px;border-top:1px dashed var(--color-border-tertiary,#e2e2e2)}
.overlay-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--border-radius-md,6px);border:0.5px solid var(--color-border-secondary,#ddd);background:var(--color-background-primary,#fff);cursor:pointer;font-size:12px;color:var(--color-text-secondary,#444);transition:all .15s}
.overlay-btn.active{border-color:#7b2d8e;color:#7b2d8e;background:#f6ecf9}
.legend-swatch-gradient{width:36px;height:10px;border-radius:3px;background:linear-gradient(to right, rgba(123,45,142,0.05), rgba(123,45,142,0.9))}
h2.map-title{position:sticky;top:0;z-index:20;text-align:center;padding:12px;font-size:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
#status-banner{display:none;padding:8px 14px;font-size:12px;border-top:0.5px solid var(--color-border-tertiary,#e2e2e2)}
</style>
</head>
<body>
<h2 class="map-title">Interactive map of Cogistics Cold Storage locations & DC's of Interest</h2>
<div id="map-wrap">
  <div id="map"></div>
  <div id="controls">
    <div class="ctrl-row" id="layer-controls"></div>
    <div class="ctrl-row overlay-row" id="overlay-controls"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div id="status-banner"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
// Population by district (khet), Bangkok Metropolitan Administration
// registered-population figures as compiled on Wikipedia's "Districts of
// Bangkok" page (sourced from BMA civil registration data, ~2020 vintage).
// This is population count, not population *density* per km² — precise
// area figures for all 50 districts weren't available to compute true
// density, so this shows relative concentration of residents by district
// rather than a density-per-km² claim. Swap in updated BMA figures here
// if you get them later.
const BANGKOK_POPULATION_DATA = [
  { name: 'Bang Bon', population: 105161, lat: 13.6592, lng: 100.3991 },
  { name: 'Bang Kapi', population: 148465, lat: 13.765833, lng: 100.647778 },
  { name: 'Bang Khae', population: 191781, lat: 13.696111, lng: 100.409444 },
  { name: 'Bang Khen', population: 189539, lat: 13.873889, lng: 100.596389 },
  { name: 'Bang Kho Laem', population: 94956, lat: 13.693333, lng: 100.5025 },
  { name: 'Bang Khun Thian', population: 165491, lat: 13.660833, lng: 100.435833 },
  { name: 'Bang Na', population: 95912, lat: 13.680081, lng: 100.5918 },
  { name: 'Bang Phlat', population: 99273, lat: 13.793889, lng: 100.505 },
  { name: 'Bang Rak', population: 45875, lat: 13.730833, lng: 100.524167 },
  { name: 'Bang Sue', population: 132234, lat: 13.809722, lng: 100.537222 },
  { name: 'Bangkok Noi', population: 117793, lat: 13.770867, lng: 100.467933 },
  { name: 'Bangkok Yai', population: 72321, lat: 13.722778, lng: 100.476389 },
  { name: 'Bueng Kum', population: 145830, lat: 13.785278, lng: 100.669167 },
  { name: 'Chatuchak', population: 160906, lat: 13.828611, lng: 100.559722 },
  { name: 'Chom Thong', population: 158005, lat: 13.677222, lng: 100.484722 },
  { name: 'Din Daeng', population: 130220, lat: 13.769722, lng: 100.552778 },
  { name: 'Don Mueang', population: 166261, lat: 13.913611, lng: 100.589722 },
  { name: 'Dusit', population: 107655, lat: 13.776944, lng: 100.520556 },
  { name: 'Huai Khwang', population: 78175, lat: 13.776667, lng: 100.579444 },
  { name: 'Khan Na Yao', population: 88678, lat: 13.8271, lng: 100.6743 },
  { name: 'Khlong Sam Wa', population: 169489, lat: 13.859722, lng: 100.704167 },
  { name: 'Khlong San', population: 76446, lat: 13.730278, lng: 100.509722 },
  { name: 'Khlong Toei', population: 109041, lat: 13.708056, lng: 100.583889 },
  { name: 'Lak Si', population: 109770, lat: 13.8875, lng: 100.578889 },
  { name: 'Lat Krabang', population: 163175, lat: 13.722317, lng: 100.759669 },
  { name: 'Lat Phrao', population: 122182, lat: 13.803611, lng: 100.6075 },
  { name: 'Min Buri', population: 137251, lat: 13.813889, lng: 100.748056 },
  { name: 'Nong Chok', population: 157138, lat: 13.855556, lng: 100.8625 },
  { name: 'Nong Khaem', population: 150218, lat: 13.704722, lng: 100.348889 },
  { name: 'Pathum Wan', population: 53263, lat: 13.744942, lng: 100.5222 },
  { name: 'Phasi Charoen', population: 129827, lat: 13.714722, lng: 100.437222 },
  { name: 'Phaya Thai', population: 72952, lat: 13.78, lng: 100.542778 },
  { name: 'Phra Khanong', population: 93482, lat: 13.702222, lng: 100.601667 },
  { name: 'Phra Nakhon', population: 57876, lat: 13.764444, lng: 100.499167 },
  { name: 'Pom Prap Sattru Phai', population: 51006, lat: 13.758056, lng: 100.513056 },
  { name: 'Prawet', population: 160671, lat: 13.716944, lng: 100.694444 },
  { name: 'Rat Burana', population: 86695, lat: 13.682222, lng: 100.505556 },
  { name: 'Ratchathewi', population: 73035, lat: 13.758889, lng: 100.534444 },
  { name: 'Sai Mai', population: 188123, lat: 13.919167, lng: 100.645833 },
  { name: 'Samphanthawong', population: 27452, lat: 13.731389, lng: 100.514167 },
  { name: 'Saphan Sung', population: 89825, lat: 13.77, lng: 100.684722 },
  { name: 'Sathon', population: 84916, lat: 13.708056, lng: 100.526389 },
  { name: 'Suan Luang', population: 115658, lat: 13.730278, lng: 100.651389 },
  { name: 'Taling Chan', population: 106604, lat: 13.776944, lng: 100.456667 },
  { name: 'Thawi Watthana', population: 76351, lat: 13.7878, lng: 100.3638 },
  { name: 'Thon Buri', population: 119708, lat: 13.725, lng: 100.485833 },
  { name: 'Thung Khru', population: 116473, lat: 13.6472, lng: 100.4958 },
  { name: 'Wang Thonglang', population: 114768, lat: 13.7864, lng: 100.6087 },
  { name: 'Watthana', population: 81623, lat: 13.742222, lng: 100.585833 },
  { name: 'Yan Nawa', population: 81521, lat: 13.696944, lng: 100.543056 },
];

(async function () {
  const statusEl = document.getElementById('status-banner');
  function showStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    statusEl.style.background = isError ? '#f8d7da' : '#fff3cd';
    statusEl.style.color = isError ? '#721c24' : '#856404';
  }

  async function loadPinData() {
    const res = await fetch('/api/pins', { credentials: 'same-origin' });
    if (res.status === 401) {
      window.location.href = '/login.html';
      return null;
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `Failed to load pins (HTTP ${res.status})`);
    }
    return res.json();
  }

  // Turn the flat { groups, pins } response from /api/pins into the same
  // per-layer shape the map rendering code below expects.
  function buildLayers(data) {
    const byId = {};
    (data.groups || []).forEach((g) => {
      byId[g.id] = { ...g, points: [] };
    });
    (data.pins || []).forEach((p) => {
      if (!byId[p.group]) {
        // A pin references a group that doesn't exist in the Groups table.
        // Surface it rather than silently dropping the pin.
        byId[p.group] = {
          id: p.group || 'ungrouped',
          label: p.group || 'Ungrouped',
          color: '#999999',
          active: true,
          order: 999,
          popupStyle: 'Label Only',
          points: [],
        };
      }
      byId[p.group].points.push(p);
    });
    return Object.values(byId).sort((a, b) => a.order - b.order);
  }

  function makeIcon(color) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
      <path d="M14 2C7.4 2 2 7.4 2 14c0 9 12 20 12 20s12-11 12-20C26 7.4 20.6 2 14 2z" fill="${color}" stroke="#fff" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="5" fill="#fff" opacity="0.9"/>
      <circle cx="14" cy="14" r="2.5" fill="${color}"/>
    </svg>`;
    return L.divIcon({ html: svg, className: '', iconSize: [28, 36], iconAnchor: [14, 36], popupAnchor: [0, -36] });
  }

  let data;
  try {
    data = await loadPinData();
    if (!data) return; // redirected to login
  } catch (err) {
    showStatus('Could not load map data: ' + err.message, true);
    return;
  }

  const LAYERS = buildLayers(data);
  if (LAYERS.length === 0) {
    showStatus('No pins found yet. Add rows to the Pins table in Lark to see them here.', false);
  }

  const map = L.map('map', { zoomControl: true }).setView([13.67, 100.7], 8.5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Population data: BMA registered population by district (via Wikipedia)',
    maxZoom: 15,
  }).addTo(map);

  // Population-density overlay (see-through heat layer, off by default).
  // Weighted by each district's registered population — see the data note
  // above BANGKOK_POPULATION_DATA for what this does and doesn't represent.
  const maxPopulation = Math.max(...BANGKOK_POPULATION_DATA.map((d) => d.population));
  const heatPoints = BANGKOK_POPULATION_DATA.map((d) => [d.lat, d.lng, d.population / maxPopulation]);
  const populationHeatLayer = L.heatLayer(heatPoints, {
    radius: 45,
    blur: 35,
    maxZoom: 13,
    minOpacity: 0.15,
    gradient: { 0.2: '#f0d9f7', 0.5: '#b565d6', 0.8: '#8a2ec0', 1.0: '#5c1a80' },
  });
  let populationLayerActive = false;

  const overlayContainer = document.getElementById('overlay-controls');
  const populationBtn = document.createElement('button');
  populationBtn.className = 'overlay-btn';
  populationBtn.innerHTML = '🏙️ Population Density';
  populationBtn.title = 'BMA registered population by district — shows relative concentration, not exact density per km²';
  populationBtn.addEventListener('click', () => {
    populationLayerActive = !populationLayerActive;
    if (populationLayerActive) {
      populationHeatLayer.addTo(map);
      populationBtn.classList.add('active');
    } else {
      map.removeLayer(populationHeatLayer);
      populationBtn.classList.remove('active');
    }
  });
  overlayContainer.appendChild(populationBtn);

  const layerGroups = {};
  const layerMarkers = {};

  LAYERS.forEach((layer) => {
    const group = L.layerGroup();
    const markers = [];
    const isPopupLayer = layer.popupStyle === 'Full Popup';

    layer.points.forEach((pt) => {
      const marker = L.marker([pt.lat, pt.lng], { icon: makeIcon(layer.color) });

      if (isPopupLayer) {
        marker.bindPopup(
          `<div style="min-width:200px;font-family:sans-serif">
            <div style="font-weight:500;font-size:12px;margin-bottom:4px;color:#111">${escapeHtml(pt.name)}</div>
            <div style="font-size:10px;color:#555;line-height:1.5">${escapeHtml(pt.note || '')}</div>
          </div>`,
          { maxWidth: 260, closeButton: false, autoClose: false, closeOnClick: false, closeOnEscapeKey: false }
        );
      } else {
        marker.bindTooltip(pt.name, { permanent: true, direction: 'right', offset: [6, 0], className: 'small-label' });
      }

      marker.on('click', () => {
        showStatus(`${pt.name} · ${layer.label}`, false);
      });

      group.addLayer(marker);
      markers.push(marker);
    });

    layerGroups[layer.id] = group;
    layerMarkers[layer.id] = markers;
    if (layer.active) group.addTo(map);
  });

  function openAllPopupsForLayer(layer) {
    if (layer.popupStyle !== 'Full Popup') return;
    layerMarkers[layer.id].forEach((m) => m.openPopup());
  }
  LAYERS.forEach((layer) => {
    if (layer.active) openAllPopupsForLayer(layer);
  });

  const ctrlContainer = document.getElementById('layer-controls');
  LAYERS.forEach((layer) => {
    const btn = document.createElement('button');
    btn.className = 'layer-btn' + (layer.active ? ' active' : '');
    btn.style.background = layer.active ? layer.color : '';
    btn.innerHTML = `<span class="dot" style="background:${layer.color}"></span>${escapeHtml(layer.label)} <span style="opacity:0.7;font-size:11px">(${layer.points.length})</span>`;
    btn.addEventListener('click', () => {
      layer.active = !layer.active;
      if (layer.active) {
        layerGroups[layer.id].addTo(map);
        btn.classList.add('active');
        btn.style.background = layer.color;
        setTimeout(() => openAllPopupsForLayer(layer), 0);
      } else {
        map.removeLayer(layerGroups[layer.id]);
        btn.classList.remove('active');
        btn.style.background = '';
      }
    });
    ctrlContainer.appendChild(btn);
  });

  const legendContainer = document.getElementById('legend');
  LAYERS.forEach((layer) => {
    const item = document.createElement('div');
    item.className = 'leg-item';
    item.innerHTML = `<span class="dot" style="background:${layer.color}"></span>${escapeHtml(layer.label)}`;
    legendContainer.appendChild(item);
  });
  const popLegendItem = document.createElement('div');
  popLegendItem.className = 'leg-item';
  popLegendItem.innerHTML = `<span class="legend-swatch-gradient"></span>Population density (low → high)`;
  legendContainer.appendChild(popLegendItem);

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
})();
</script>
</body>
</html>
