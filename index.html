<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,sans-serif);background:transparent}
#map-wrap{position:relative;width:100%;background:var(--color-background-secondary,#f7f7f8);border-radius:var(--border-radius-lg,10px);overflow:hidden;border:0.5px solid var(--color-border-tertiary,#e2e2e2)}
#map{width:100%;height:calc(100vh - 90px)}
#controls{padding:12px 14px;border-top:0.5px solid var(--color-border-tertiary,#e2e2e2);background:var(--color-background-primary,#fff)}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.layer-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--border-radius-md,6px);border:0.5px solid var(--color-border-secondary,#ddd);background:var(--color-background-primary,#fff);cursor:pointer;font-size:12px;color:var(--color-text-secondary,#444);transition:all .15s}
.layer-btn.active{border-color:transparent;color:#fff}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 14px;border-top:0.5px solid var(--color-border-tertiary,#e2e2e2)}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary,#555)}
.leaflet-popup-close-button{display:none !important}
.small-label{background:rgba(255,255,255,0.85);border:none;box-shadow:none;padding:1px 4px;font-size:9px;line-height:1.2;color:#333;font-weight:500;white-space:nowrap}
.small-label::before{display:none}
.overlay-row{padding-top:8px;margin-top:8px;border-top:1px dashed var(--color-border-tertiary,#e2e2e2)}
.overlay-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--border-radius-md,6px);border:0.5px solid var(--color-border-secondary,#ddd);background:var(--color-background-primary,#fff);cursor:pointer;font-size:12px;color:var(--color-text-secondary,#444);transition:all .15s}
.overlay-btn.active{border-color:#7b2d8e;color:#7b2d8e;background:#f6ecf9}
.legend-swatch-gradient{width:36px;height:10px;border-radius:3px;background:linear-gradient(to right, rgba(123,45,142,0.05), rgba(123,45,142,0.9))}
#top5-panel{display:none;position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:500;width:210px;background:rgba(255,255,255,0.97);border:0.5px solid var(--color-border-secondary,#ddd);border-radius:var(--border-radius-lg,10px);box-shadow:0 4px 16px rgba(0,0,0,0.15);padding:10px;font-family:var(--font-sans,sans-serif)}
#top5-panel.visible{display:block}
.top5-header{font-size:11px;font-weight:600;color:#5c1a80;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #eee}
.top5-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 6px;border:none;background:none;border-radius:6px;cursor:pointer;text-align:left;margin-bottom:2px;transition:background .12s}
.top5-row:hover{background:#f6ecf9}
.top5-name{font-size:11px;color:#333;display:flex;flex-direction:column;line-height:1.3}

#map-toolbar{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:6px}
.map-tool-btn{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--border-radius-md,6px);border:0.5px solid var(--color-border-secondary,#ccc);background:rgba(255,255,255,0.95);cursor:pointer;font-size:11px;color:#333;box-shadow:0 1px 4px rgba(0,0,0,0.12);transition:all .12s}
.map-tool-btn:hover{background:#fff}
.map-tool-btn.active{border-color:#5c1a80;color:#5c1a80;background:#f6ecf9}
.map-tool-btn:disabled{opacity:0.6;cursor:default}
body.presentation-mode h2.map-title,
body.presentation-mode #controls,
body.presentation-mode .legend{display:none}
body.presentation-mode #map{height:100vh}
h2.map-title{position:sticky;top:0;z-index:20;text-align:center;padding:12px;font-size:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.08)}

<script>
// Population by district (khet), Bangkok Metropolitan Administration

// by the user from BMA's district-level statistics. Centroids are from
// Wikipedia's "Districts of Bangkok" compilation (unchanged by this update).
// This is population count, not population *density* per km² — precise
// area figures for all 50 districts weren't available to compute true
// density, so this shows relative concentration of residents by district
// rather than a density-per-km² claim.
const BANGKOK_POPULATION_DATA = [
  { name: 'Bang Bon', nameTh: 'บางบอน', population: 99168, lat: 13.6592, lng: 100.3991 },
  { name: 'Bang Kapi', nameTh: 'บางกะปิ', population: 141412, lat: 13.765833, lng: 100.647778 },
  { name: 'Bang Khae', nameTh: 'บางแค', population: 192481, lat: 13.696111, lng: 100.409444 },

  { name: 'Bang Kho Laem', nameTh: 'บางคอแหลม', population: 76224, lat: 13.693333, lng: 100.5025 },
  { name: 'Bang Khun Thian', nameTh: 'บางขุนเทียน', population: 185595, lat: 13.660833, lng: 100.435833 },
  { name: 'Bang Na', nameTh: 'บางนา', population: 85001, lat: 13.680081, lng: 100.5918 },

  { name: 'Bangkok Noi', nameTh: 'บางกอกน้อย', population: 96745, lat: 13.770867, lng: 100.467933 },
  { name: 'Bangkok Yai', nameTh: 'บางกอกใหญ่', population: 59797, lat: 13.722778, lng: 100.476389 },
  { name: 'Bueng Kum', nameTh: 'บึงกุ่ม', population: 136108, lat: 13.785278, lng: 100.669167 },
  { name: 'Chatuchak', nameTh: 'จตุจักร', population: 154500, lat: 13.828611, lng: 100.559722 },
  { name: 'Chom Thong', nameTh: 'จอมทอง', population: 139427, lat: 13.677222, lng: 100.484722 },
  { name: 'Din Daeng', nameTh: 'ดินแดง', population: 110780, lat: 13.769722, lng: 100.552778 },
  { name: 'Don Mueang', nameTh: 'ดอนเมือง', population: 166047, lat: 13.913611, lng: 100.589722 },
  { name: 'Dusit', nameTh: 'ดุสิต', population: 74584, lat: 13.776944, lng: 100.520556 },
  { name: 'Huai Khwang', nameTh: 'ห้วยขวาง', population: 83958, lat: 13.776667, lng: 100.579444 },
  { name: 'Khan Na Yao', nameTh: 'คันนายาว', population: 94194, lat: 13.8271, lng: 100.6743 },
  { name: 'Khlong Sam Wa', nameTh: 'คลองสามวา', population: 214311, lat: 13.859722, lng: 100.704167 },
  { name: 'Khlong San', nameTh: 'คลองสาน', population: 63357, lat: 13.730278, lng: 100.509722 },
  { name: 'Khlong Toei', nameTh: 'คลองเตย', population: 89013, lat: 13.708056, lng: 100.583889 },
  { name: 'Lak Si', nameTh: 'หลักสี่', population: 98177, lat: 13.8875, lng: 100.578889 },
  { name: 'Lat Krabang', nameTh: 'ลาดกระบัง', population: 181253, lat: 13.722317, lng: 100.759669 },
  { name: 'Lat Phrao', nameTh: 'ลาดพร้าว', population: 112086, lat: 13.803611, lng: 100.6075 },
  { name: 'Min Buri', nameTh: 'มีนบุรี', population: 140752, lat: 13.813889, lng: 100.748056 },
  { name: 'Nong Chok', nameTh: 'หนองจอก', population: 186227, lat: 13.855556, lng: 100.8625 },
  { name: 'Nong Khaem', nameTh: 'หนองแขม', population: 154956, lat: 13.704722, lng: 100.348889 },
  { name: 'Pathum Wan', nameTh: 'ปทุมวัน', population: 39399, lat: 13.744942, lng: 100.5222 },
  { name: 'Phasi Charoen', nameTh: 'ภาษีเจริญ', population: 121716, lat: 13.714722, lng: 100.437222 },
  { name: 'Phaya Thai', nameTh: 'พญาไท', population: 63025, lat: 13.78, lng: 100.542778 },
  { name: 'Phra Khanong', nameTh: 'พระโขนง', population: 85070, lat: 13.702222, lng: 100.601667 },
  { name: 'Phra Nakhon', nameTh: 'พระนคร', population: 39345, lat: 13.764444, lng: 100.499167 },
  { name: 'Pom Prap Sattru Phai', nameTh: 'ป้อมปราบศัตรูพ่าย', population: 36905, lat: 13.758056, lng: 100.513056 },
  { name: 'Prawet', nameTh: 'ประเวศ', population: 184355, lat: 13.716944, lng: 100.694444 },
  { name: 'Rat Burana', nameTh: 'ราษฎร์บูรณะ', population: 74977, lat: 13.682222, lng: 100.505556 },
  { name: 'Ratchathewi', nameTh: 'ราชเทวี', population: 62632, lat: 13.758889, lng: 100.534444 },
  { name: 'Sai Mai', nameTh: 'สายไหม', population: 212575, lat: 13.919167, lng: 100.645833 },
  { name: 'Samphanthawong', nameTh: 'สัมพันธวงศ์', population: 18845, lat: 13.731389, lng: 100.514167 },
  { name: 'Saphan Sung', nameTh: 'สะพานสูง', population: 97659, lat: 13.77, lng: 100.684722 },
  { name: 'Sathon', nameTh: 'สาทร', population: 70320, lat: 13.708056, lng: 100.526389 },
  { name: 'Suan Luang', nameTh: 'สวนหลวง', population: 123405, lat: 13.730278, lng: 100.651389 },
  { name: 'Taling Chan', nameTh: 'ตลิ่งชัน', population: 100887, lat: 13.776944, lng: 100.456667 },
  { name: 'Thawi Watthana', nameTh: 'ทวีวัฒนา', population: 80349, lat: 13.7878, lng: 100.3638 },
  { name: 'Thon Buri', nameTh: 'ธนบุรี', population: 97169, lat: 13.725, lng: 100.485833 },
  { name: 'Thung Khru', nameTh: 'ทุ่งครุ', population: 124064, lat: 13.6472, lng: 100.4958 },
  { name: 'Wang Thonglang', nameTh: 'วังทองหลาง', population: 103056, lat: 13.7864, lng: 100.6087 },
  { name: 'Watthana', nameTh: 'วัฒนา', population: 80272, lat: 13.742222, lng: 100.585833 },
  { name: 'Yan Nawa', nameTh: 'ยานนาวา', population: 72833, lat: 13.696944, lng: 100.543056 },
];

(async function () {
  const statusEl = document.getElementById('status-banner');
  function showStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    statusEl.style.background = isError ? '#f8d7da' : '#fff3cd';
    statusEl.style.color = isError ? '#721c24' : '#856404';
  }

  async function loadPinData() {
    const res = await fetch('/api/pins', { credentials: 'same-origin' });
    if (res.status === 401) {
      window.location.href = '/login.html';
      return null;
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `Failed to load pins (HTTP ${res.status})`);
    }
    return res.json();
  }

  // Turn the flat { groups, pins } response from /api/pins into the same
  // per-layer shape the map rendering code below expects.
  function buildLayers(data) {
    const byId = {};
    (data.groups || []).forEach((g) => {
      byId[g.id] = { ...g, points: [] };
    });
    (data.pins || []).forEach((p) => {
      if (!byId[p.group]) {
        // A pin references a group that doesn't exist in the Groups table.
        // Surface it rather than silently dropping the pin.
        byId[p.group] = {
          id: p.group || 'ungrouped',
          label: p.group || 'Ungrouped',
          color: '#999999',
          active: true,
          order: 999,
          popupStyle: 'Label Only',
          points: [],
        };
      }
      byId[p.group].points.push(p);
    });
    return Object.values(byId).sort((a, b) => a.order - b.order);
  }

  function makeIcon(color) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
      <path d="M14 2C7.4 2 2 7.4 2 14c0 9 12 20 12 20s12-11 12-20C26 7.4 20.6 2 14 2z" fill="${color}" stroke="#fff" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="5" fill="#fff" opacity="0.9"/>
      <circle cx="14" cy="14" r="2.5" fill="${color}"/>
    </svg>`;
    return L.divIcon({ html: svg, className: '', iconSize: [28, 36], iconAnchor: [14, 36], popupAnchor: [0, -36] });
  }

  let data;
  try {
    data = await loadPinData();
    if (!data) return; // redirected to login
  } catch (err) {
    showStatus('Could not load map data: ' + err.message, true);
    return;
  }

  const LAYERS = buildLayers(data);
  if (LAYERS.length === 0) {
    showStatus('No pins found yet. Add rows to the Pins table in Lark to see them here.', false);
  }

  const map = L.map('map', { zoomControl: true }).setView([13.67, 100.7], 8.5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Population data: BMA registered population by district (via Wikipedia)',
    maxZoom: 15,
  }).addTo(map);

  // Population-density overlay (see-through heat layer, off by default).
  // Weighted by each district's registered population — see the data note
  // above BANGKOK_POPULATION_DATA for what this does and doesn't represent.
  const maxPopulation = Math.max(...BANGKOK_POPULATION_DATA.map((d) => d.population));
  const totalPopulation = BANGKOK_POPULATION_DATA.reduce((sum, d) => sum + d.population, 0);
  const heatPoints = BANGKOK_POPULATION_DATA.map((d) => [d.lat, d.lng, d.population / maxPopulation]);
  const populationHeatLayer = L.heatLayer(heatPoints, {
    radius: 45,
    blur: 35,
    maxZoom: 13,
    minOpacity: 0.15,
    gradient: { 0.2: '#f0d9f7', 0.5: '#b565d6', 0.8: '#8a2ec0', 1.0: '#5c1a80' },
  });

  // The heat layer itself is a single canvas blur with no clickable regions,
  // so a small clickable dot sits at each district's centroid on top of it,
  // showing the real number behind that part of the blob on click. Kept in
  // a name->marker lookup too, so the top-5 panel can open the same popup.
  const populationMarkersByName = {};
  const populationMarkersLayer = L.layerGroup(
    BANGKOK_POPULATION_DATA.map((d) => {
      const marker = L.circleMarker([d.lat, d.lng], {
        radius: 7,
        color: '#5c1a80',
        weight: 1,
        fillColor: '#5c1a80',
        fillOpacity: 0.3,
        opacity: 0.5,
      });
      const pctOfTotal = ((d.population / totalPopulation) * 100).toFixed(1);
      marker.bindPopup(
        `<div style="min-width:190px;font-family:sans-serif">
          <div style="font-weight:600;font-size:12px;margin-bottom:1px;color:#111">${escapeHtml(d.name)}</div>
          <div style="font-size:10px;color:#888;margin-bottom:5px">${escapeHtml(d.nameTh || '')}</div>
          <div style="font-size:11px;color:#555;line-height:1.7">
            Registered population: <strong>${d.population.toLocaleString()}</strong><br/>
            ${pctOfTotal}% of Bangkok's total registered population
          </div>
        </div>`,
        { maxWidth: 240 }
      );
      populationMarkersByName[d.name] = marker;
      return marker;
    })
  );

  // Floating top-5 panel, shown only while the population layer is active.
  const top5Districts = [...BANGKOK_POPULATION_DATA].sort((a, b) => b.population - a.population).slice(0, 5);
  const top5Panel = document.createElement('div');
  top5Panel.id = 'top5-panel';
  top5Panel.innerHTML = `
    <div class="top5-header">Top 5 Districts by Population</div>
    ${top5Districts
      .map(
        (d) => `
      <button class="top5-row" data-name="${escapeHtml(d.name)}">
        <span class="top5-name">${escapeHtml(d.nameTh)}<span class="top5-name-en">${escapeHtml(d.name)}</span></span>
        <span class="top5-pop">${d.population.toLocaleString()}</span>
      </button>`
      )
      .join('')}
  `;
  document.getElementById('map-wrap').appendChild(top5Panel);
  top5Panel.querySelectorAll('.top5-row').forEach((row) => {
    row.addEventListener('click', () => {
      const d = BANGKOK_POPULATION_DATA.find((item) => item.name === row.dataset.name);
      const marker = populationMarkersByName[row.dataset.name];
      if (!d || !marker) return;
      map.flyTo([d.lat, d.lng], Math.max(map.getZoom(), 12), { duration: 0.6 });
      marker.openPopup();
    });
  });

  let populationLayerActive = false;

  const overlayContainer = document.getElementById('overlay-controls');
  const populationBtn = document.createElement('button');
  populationBtn.className = 'overlay-btn';
  populationBtn.innerHTML = '🏙️ Population Density';
  populationBtn.title = 'BMA registered population by district — click a blob for the district name and number. Shows relative concentration, not exact density per km².';
  populationBtn.addEventListener('click', () => {
    populationLayerActive = !populationLayerActive;
    if (populationLayerActive) {
      populationHeatLayer.addTo(map);
      populationMarkersLayer.addTo(map);
      populationBtn.classList.add('active');
      top5Panel.classList.add('visible');
    } else {
      map.removeLayer(populationHeatLayer);
      map.removeLayer(populationMarkersLayer);
      populationBtn.classList.remove('active');
      top5Panel.classList.remove('visible');
    }
  });
  overlayContainer.appendChild(populationBtn);

  const layerGroups = {};
  const layerMarkers = {};

  LAYERS.forEach((layer) => {
    const group = L.layerGroup();
    const markers = [];
    const isPopupLayer = layer.popupStyle === 'Full Popup';

    layer.points.forEach((pt) => {
      const marker = L.marker([pt.lat, pt.lng], { icon: makeIcon(layer.color) });

      if (isPopupLayer) {
        marker.bindPopup(
          `<div style="min-width:200px;font-family:sans-serif">
            <div style="font-weight:500;font-size:12px;margin-bottom:4px;color:#111">${escapeHtml(pt.name)}</div>
            <div style="font-size:10px;color:#555;line-height:1.5">${escapeHtml(pt.note || '')}</div>
          </div>`,
          { maxWidth: 260, closeButton: false, autoClose: false, closeOnClick: false, closeOnEscapeKey: false }
        );
      } else {
        marker.bindTooltip(pt.name, { permanent: true, direction: 'right', offset: [6, 0], className: 'small-label' });
      }

      marker.on('click', () => {
        showStatus(`${pt.name} · ${layer.label}`, false);
      });

      group.addLayer(marker);
      markers.push(marker);
    });

    layerGroups[layer.id] = group;
    layerMarkers[layer.id] = markers;
    if (layer.active) group.addTo(map);
  });

  function openAllPopupsForLayer(layer) {
    if (layer.popupStyle !== 'Full Popup') return;
    layerMarkers[layer.id].forEach((m) => m.openPopup());
  }
  LAYERS.forEach((layer) => {
    if (layer.active) openAllPopupsForLayer(layer);
  });

  const ctrlContainer = document.getElementById('layer-controls');
  LAYERS.forEach((layer) => {
    const btn = document.createElement('button');
    btn.className = 'layer-btn' + (layer.active ? ' active' : '');
    btn.style.background = layer.active ? layer.color : '';
    btn.innerHTML = `<span class="dot" style="background:${layer.color}"></span>${escapeHtml(layer.label)} <span style="opacity:0.7;font-size:11px">(${layer.points.length})</span>`;
    btn.addEventListener('click', () => {
      layer.active = !layer.active;
      if (layer.active) {
        layerGroups[layer.id].addTo(map);
        btn.classList.add('active');
        btn.style.background = layer.color;
        setTimeout(() => openAllPopupsForLayer(layer), 0);
      } else {
        map.removeLayer(layerGroups[layer.id]);
        btn.classList.remove('active');
        btn.style.background = '';
      }
    });
    ctrlContainer.appendChild(btn);
  });

  const legendContainer = document.getElementById('legend');
  LAYERS.forEach((layer) => {
    const item = document.createElement('div');
    item.className = 'leg-item';
    item.innerHTML = `<span class="dot" style="background:${layer.color}"></span>${escapeHtml(layer.label)}`;
    legendContainer.appendChild(item);
  });
  const popLegendItem = document.createElement('div');
  popLegendItem.className = 'leg-item';
  popLegendItem.innerHTML = `<span class="legend-swatch-gradient"></span>Population density (low → high)`;
  legendContainer.appendChild(popLegendItem);

  // --- Presentation mode: hide the toggle buttons/legend/title for a clean
  // full-bleed view while screen-sharing. Set up your layers first, then
  // switch this on — the layer buttons are hidden along with everything else.
  const presentationBtn = document.getElementById('presentation-mode-btn');
  presentationBtn.addEventListener('click', () => {
    const isOn = document.body.classList.toggle('presentation-mode');
    presentationBtn.classList.toggle('active', isOn);
    presentationBtn.innerHTML = isOn ? '🖥️ Exit Presentation' : '🖥️ Presentation Mode';
    // Leaflet needs to recompute its container size after the CSS change;
    // give the layout a moment to settle first.
    setTimeout(() => map.invalidateSize(), 100);
  });

  // --- Export current view as a PNG.
  // OSM's standard tile servers don't send the CORS headers a browser needs
  // to read tile pixels into a canvas, so a direct screenshot would export a
  // blank map background. Workaround: swap in a CORS-friendly basemap
  // (CARTO Positron, explicitly served with permissive CORS headers) only
  // for the moment of export, capture, then remove it — the exported image's
  // basemap style will look slightly cleaner/lighter than the on-screen OSM
  // tiles, as a side effect of this workaround.
  const exportBtn = document.getElementById('export-image-btn');
  exportBtn.addEventListener('click', async () => {
    exportBtn.disabled = true;
    const originalLabel = exportBtn.innerHTML;
    exportBtn.innerHTML = '📷 Exporting…';

    const exportTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      crossOrigin: true,
      maxZoom: 19,
      detectRetina: true, // fetch sharp @2x tile images on high-DPI exports, not just upscale standard ones
    }).addTo(map);

    try {
      await new Promise((resolve) => {
        let settled = false;
        exportTiles.once('load', () => {
          settled = true;
          resolve();
        });
        // Fallback in case the 'load' event doesn't fire cleanly (seen on
        // some browsers/zoom levels) — proceed anyway after a short wait.
        setTimeout(() => {
          if (!settled) resolve();
        }, 2500);
      });

      // pixelRatio renders at a higher internal resolution than the map's
      // on-screen CSS pixel size — default is 1 (soft/blurry when placed
      // into a deck or zoomed in). devicePixelRatio matches the screen's
      // own sharpness (2 on most modern laptops/Retina, sometimes 3 on
      // phones); floor it at 2 and cap at 3 so low-DPI screens still get a
      // crisp export without the file getting unreasonably large.
      const pixelRatio = Math.min(3, Math.max(2, window.devicePixelRatio || 1));
      const dataUrl = await domtoimage.toPng(document.getElementById('map'), {
        bgcolor: '#ffffff',
        pixelRatio,
      });
      const link = document.createElement('a');
      link.download = `cogistics-map-${new Date().toISOString().slice(0, 10)}.png`;
      link.href = dataUrl;
      link.click();
    } catch (err) {
      console.error('Export failed:', err);
      showStatus(
        'Image export failed (' + err.message + '). Try again, or use your OS screenshot tool as a fallback.',
        true
      );
    } finally {
      map.removeLayer(exportTiles);
      exportBtn.disabled = false;
      exportBtn.innerHTML = originalLabel;
    }
  });

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
})();
</script>
</body>
</html>
